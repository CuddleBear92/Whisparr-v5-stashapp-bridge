name: Whisparr Bridge
description: Shows and manages performers, studios and scenes in Whisparr v5 from their Stash pages.
version: 0.5.0
url: https://github.com/CuddleBear92/Whisparr-v5-stashapp-bridge

ui:
  javascript:
    - whisparr_bridge.js
  css:
    - whisparr_bridge.css

# Requests to Whisparr are relayed through whisparr_proxy.py on the Stash
# server. Stash's Content-Security-Policy blocks the browser from calling
# other hosts directly, and relaying also works when Whisparr is only reachable
# from the Stash host (for example a Docker container name).
exec:
  - python
  - "{pluginDir}/whisparr_proxy.py"
interface: raw
errLog: error

tasks:
  - name: Sync Whisparr Watched tags
    description: Tags every performer, studio and scene that is monitored in Whisparr with the watched tag, and untags the rest.
    defaultArgs:
      mode: syncTags

settings:
  whisparrHost:
    displayName: Whisparr host
    description: IP address or hostname of the Whisparr v5 server, as seen from the Stash server, e.g. 192.168.1.20, whisparr or https://whisparr.example.com
    type: STRING
  whisparrPort:
    displayName: Whisparr port
    description: Port of the Whisparr server. Leave at 0 to use the default (6969), or the scheme's default when the host starts with https://
    type: NUMBER
  whisparrUrlBase:
    displayName: Whisparr URL base (optional)
    description: Only if Whisparr is set up with a URL base (Settings > General > URL Base), e.g. /whisparr
    type: STRING
  whisparrApiKey:
    displayName: Whisparr API key
    description: Found in Whisparr under Settings > General > Security
    type: STRING
  useTpdb:
    displayName: Whisparr uses ThePornDB
    description: Turn on if your Whisparr scene metadata source is ThePornDB. Leave off for StashDB. The plugin matches items using the Stash ID from this stash-box.
    type: BOOLEAN
  whisparrPublicUrl:
    displayName: Whisparr link URL (optional)
    description: Address your browser uses to open Whisparr, for the "Open in Whisparr" links, if it differs from the host above, e.g. http://192.168.1.20:6969
    type: STRING
  # The plugin draws its own grouped settings page (connection, preset and tag
  # windows). These definitions are the fallback and document the stored keys.
  presetEnabled:
    displayName: "Preset: enabled"
    description: Shows the "Apply preset" button on performer and studio panels.
    type: BOOLEAN
  presetAskFirst:
    displayName: "Preset: ask before applying"
    description: Off = "Apply preset" applies straight away. On = it shows what will change first.
    type: BOOLEAN
  presetMonitorScenes:
    displayName: "Preset: Monitor scenes"
    description: Value the "Apply preset" button sets on a performer or studio. The four preset toggles are only applied once at least one of them has been saved.
    type: BOOLEAN
  presetMonitorMovies:
    displayName: "Preset: Monitor movies"
    description: Needs a TMDB/TPDB link on the stash-box. If Whisparr refuses it, the rest of the preset is still applied.
    type: BOOLEAN
  presetMonitorJav:
    displayName: "Preset: Monitor JAV"
    description: Only used where Whisparr offers it (ThePornDB as source, and the performer/studio has JAV).
    type: BOOLEAN
  presetMonitorNewItems:
    displayName: "Preset: Monitor new items"
    type: BOOLEAN
  presetSearchOnAdd:
    displayName: "Preset: Search on add"
    type: BOOLEAN
  yearPreset:
    displayName: "Preset: years to monitor"
    description: 'Years "Apply preset" monitors. Examples - all, none, 2020+, 2018-2022, -2015, last 5, or a mix like "2015, 2019-2021". Empty means all years; none leaves years alone.'
    type: STRING
  yearPresetUnmonitorOthers:
    displayName: "Preset: unmonitor other years"
    description: When on, applying the preset also unmonitors works from years outside it. When off, it only adds monitoring.
    type: BOOLEAN
  watchedTagName:
    displayName: Watched tag name
    description: Stash tag kept on performers, studios and scenes that are monitored in Whisparr. Empty means "Whisparr Watched".
    type: STRING
  disableWatchedTag:
    displayName: Don't manage the watched tag
    description: Turn on to stop the plugin from adding or removing the watched tag.
    type: BOOLEAN
  disablePerformers:
    displayName: Off on performer pages
    description: Hide the Whisparr panel on performer pages
    type: BOOLEAN
  disableStudios:
    displayName: Off on studio pages
    description: Hide the Whisparr panel on studio pages
    type: BOOLEAN
  disableScenes:
    displayName: Off on scene pages
    description: Hide the Whisparr tab on scene pages
    type: BOOLEAN
